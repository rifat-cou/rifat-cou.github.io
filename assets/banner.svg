<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1500 200" width="1500" height="200" role="img"
     aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Rifat — process running, aim true</title>
  <desc id="bannerDesc">Signal waves flow in from either side toward a desk where a process runs on screen like a small train on a loop, while a seated figure periodically fires an arrow at a target.</desc>

  <defs>
    <style>
      .ink-shape  { fill:#0B1120; }
      .ink-stroke { stroke:#0B1120; }
      .dim        { fill:#7C8AA8; stroke:#7C8AA8; }
      .paper-fill { fill:#EAEDF3; }
      @media (prefers-color-scheme: dark) {
        .ink-shape  { fill:#E7E9EE; }
        .ink-stroke { stroke:#E7E9EE; }
        .dim        { fill:#4B5875; stroke:#4B5875; }
        .paper-fill { fill:#131B2E; }
      }
    </style>

    <clipPath id="leftWaveClip"><rect x="0" y="0" width="430" height="200"/></clipPath>
    <clipPath id="rightWaveClip"><rect x="1070" y="0" width="430" height="200"/></clipPath>
    <clipPath id="screenClip"><rect x="660" y="60" width="152" height="80" rx="4"/></clipPath>

    <path id="leftWavePath" d="M-20,100 C8,82 26,118 54,100 S100,82 128,100 S174,118 202,100 S248,82 276,100 S322,118 350,100 S396,82 424,100 S452,118 470,100"/>
    <path id="rightWavePath" d="M1520,100 C1492,82 1474,118 1446,100 S1400,82 1372,100 S1326,118 1298,100 S1252,82 1224,100 S1178,118 1150,100 S1104,82 1076,100 S1048,118 1030,100"/>
    <path id="arrowFlight" d="M604,100 L940,100"/>
  </defs>

  <!-- ================= LEFT SIGNAL — flows inward toward center ================= -->
  <g clip-path="url(#leftWaveClip)">
    <use xlink:href="#leftWavePath" fill="none" stroke="#2AC6B6" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="10 9">
      <animate attributeName="stroke-dashoffset" from="0" to="-76" dur="1.7s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#leftWavePath" transform="translate(0,26)" fill="none" stroke="#F2B705" stroke-width="1.6" opacity=".5" stroke-dasharray="6 11">
      <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="2.3s" repeatCount="indefinite"/>
    </use>
    <circle r="4" fill="#F2B705">
      <animateMotion dur="3.3s" repeatCount="indefinite">
        <mpath xlink:href="#leftWavePath"/>
      </animateMotion>
    </circle>
  </g>

  <!-- ================= RIGHT SIGNAL — flows inward toward center ================= -->
  <g clip-path="url(#rightWaveClip)">
    <use xlink:href="#rightWavePath" fill="none" stroke="#2AC6B6" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="10 9">
      <animate attributeName="stroke-dashoffset" from="0" to="-76" dur="1.7s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#rightWavePath" transform="translate(0,26)" fill="none" stroke="#F2B705" stroke-width="1.6" opacity=".5" stroke-dasharray="6 11">
      <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="2.3s" repeatCount="indefinite"/>
    </use>
    <circle r="4" fill="#F2B705">
      <animateMotion dur="3.3s" repeatCount="indefinite">
        <mpath xlink:href="#rightWavePath"/>
      </animateMotion>
    </circle>
  </g>

  <!-- ================= DESK SCENE ================= -->
  <g>
    <!-- desk -->
    <line x1="470" y1="158" x2="1030" y2="158" class="ink-stroke" stroke-width="5" stroke-linecap="round"/>
    <line x1="492" y1="158" x2="492" y2="184" class="dim" stroke-width="4" stroke-linecap="round"/>
    <line x1="1008" y1="158" x2="1008" y2="184" class="dim" stroke-width="4" stroke-linecap="round"/>

    <!-- seated figure, facing right toward the screen and target -->
    <rect x="548" y="150" width="42" height="8" rx="3" class="dim"/>
    <line x1="568" y1="158" x2="568" y2="184" class="dim" stroke-width="4" stroke-linecap="round"/>
    <rect x="568" y="136" width="34" height="9" rx="4" class="ink-shape"/>
    <rect x="592" y="136" width="9" height="24" rx="4" class="ink-shape"/>
    <ellipse cx="596" cy="160" rx="8" ry="4" class="ink-shape"/>
    <rect x="553" y="92" width="24" height="46" rx="11" fill="#F2B705"/>
    <circle cx="566" cy="78" r="13" class="ink-shape"/>

    <!-- arm + bow: draws back, then releases just before the arrow fires -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        keyTimes="0;0.55;0.62;0.66;1"
        values="0 577 102;-10 577 102;-10 577 102;4 577 102;0 577 102"
        dur="6s" repeatCount="indefinite"/>
      <line x1="577" y1="102" x2="602" y2="98" class="ink-stroke" stroke-width="6" stroke-linecap="round"/>
      <path d="M600,84 Q616,100 600,116" fill="none" stroke="#2AC6B6" stroke-width="3" stroke-linecap="round"/>
      <line x1="600" y1="84" x2="600" y2="116" class="dim" stroke-width="1.5"/>
    </g>

    <!-- monitor -->
    <rect x="648" y="48" width="176" height="104" rx="10" fill="#0B1120"/>
    <rect x="660" y="60" width="152" height="80" rx="4" fill="#0D1A2E"/>
    <rect x="706" y="158" width="56" height="5" rx="2" fill="#0B1120"/>
    <rect x="722" y="152" width="24" height="8" fill="#0B1120"/>

    <!-- process running on screen, styled like a little train on a loop -->
    <g clip-path="url(#screenClip)">
      <line x1="666" y1="122" x2="806" y2="122" stroke="#2AC6B6" stroke-width="2" opacity=".45" stroke-dasharray="5 5"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="640,112;832,112" dur="3s" repeatCount="indefinite"/>
        <rect x="-16" y="-9" width="26" height="12" rx="3" fill="#F2B705"/>
        <rect x="-4" y="-18" width="12" height="10" rx="2" fill="#F2B705"/>
        <rect x="-1" y="-24" width="4" height="6" fill="#7C8AA8"/>
        <circle cx="-9" cy="5" r="4" fill="#0B1120"/>
        <circle cx="8" cy="5" r="4" fill="#0B1120"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 -9 5;360 -9 5" dur=".4s" repeatCount="indefinite"/>
          <line x1="-9" y1="2" x2="-9" y2="8" stroke="#F2B705" stroke-width="1"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 8 5;360 8 5" dur=".4s" repeatCount="indefinite"/>
          <line x1="8" y1="2" x2="8" y2="8" stroke="#F2B705" stroke-width="1"/>
        </g>
        <circle cx="0" cy="-26" r="2.4" fill="#EAEDF3">
          <animate attributeName="cy" values="-26;-38" dur="1.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".55;0" dur="1.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1" cy="-27" r="1.8" fill="#EAEDF3">
          <animate attributeName="cy" values="-27;-40" dur="1.4s" begin=".5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".5;0" dur="1.4s" begin=".5s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- target -->
    <line x1="940" y1="124" x2="940" y2="158" class="dim" stroke-width="4" stroke-linecap="round"/>
    <circle cx="940" cy="100" r="30" fill="#2AC6B6">
      <animate attributeName="opacity" values=".08;.22;.08" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="100" r="24" class="paper-fill ink-stroke" stroke-width="1.5"/>
    <circle cx="940" cy="100" r="17" fill="#F2B705"/>
    <circle cx="940" cy="100" r="10" class="paper-fill"/>
    <circle cx="940" cy="100" r="4" fill="#2AC6B6"/>

    <!-- impact flash, timed to the arrow's arrival -->
    <circle cx="940" cy="100" r="6" fill="#EAEDF3" opacity="0">
      <animate attributeName="r" keyTimes="0;0.715;0.72;0.85;1" values="6;6;6;28;28" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" keyTimes="0;0.715;0.72;0.85;1" values="0;0;.9;0;0" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- the arrow — hidden until release, flies across, lands, resets -->
    <g opacity="0">
      <animate attributeName="opacity" keyTimes="0;0.60;0.62;0.9;0.96;1" values="0;0;1;1;0;0" dur="6s" repeatCount="indefinite"/>
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.62;0.72;1" keyPoints="0;0;1;1">
        <mpath xlink:href="#arrowFlight"/>
      </animateMotion>
      <line x1="-16" y1="0" x2="0" y2="0" stroke="#2AC6B6" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="0,-4 8,0 0,4" fill="#2AC6B6"/>
      <polygon points="-16,-3 -10,0 -16,3" fill="#F2B705"/>
    </g>
  </g>
</svg>
